# Render blueprint for the online version (Render web service + Neon database).
services:
  - type: web
    name: cna-fund-monitor
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL        # the Neon connection string; paste it in the Render dashboard
        sync: false
      - key: ADMIN_PASSWORD      # first sign-in password for "admin"; you must change it after signing in
        sync: false
      - key: SESSION_SECRET      # random value generated by Render
        generateValue: true
